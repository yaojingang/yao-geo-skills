interface:
  display_name: "Yao GEOFlow Design"
  short_description: "Discover, compare, preview, and manage GEOFlow default and channel frontend experiences safely"
  default_prompt: "Use $yao-geoflow-design for current GEOFlow frontend design: Laravel Blade theme discovery, preview edit sessions, reference-site mapping, homepage-design.json, lead_form modules with existing slug, default-vs-channel capability checks, target-package gaps, and sync-preview planning. Do not implement backend/CRUD or activate live changes."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
