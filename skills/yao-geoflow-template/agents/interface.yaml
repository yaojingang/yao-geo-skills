interface:
  display_name: "Yao GEOFlow Template Legacy Router"
  short_description: "Interpret legacy GEOFlow PHP template notes and route current frontend work to design"
  default_prompt: "Use only for explicit legacy GEOFlow PHP template-package questions or historical output review. Route current Laravel Blade, homepage modules, lead_form, reference cloning, theme editor, channel frontend, and target-package work to yao-geoflow-design."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
